# /etc/ssh/sshd_config.d/10-hardening.conf
# Key-only SSH (hardware-backed key on a YubiKey PIV slot), restricted to the admin subnets.

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitEmptyPasswords no
AuthenticationMethods publickey

# Only this user, and only from the management VLAN and the remote-access VPN subnet.
AllowUsers admin@192.168.10.0/24 admin@10.8.0.0/24

# The only forward allowed is the tunnel to the app's local admin page.
AllowTcpForwarding local
PermitOpen 127.0.0.1:10443
AllowAgentForwarding no
X11Forwarding no
PermitTunnel no
GatewayPorts no

MaxAuthTries 3
MaxSessions 2
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
LogLevel VERBOSE
Banner /etc/issue.net
