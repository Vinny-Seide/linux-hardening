# /etc/ssh/sshd_config.d/10-hardening.conf
# ssh.service stays disabled on this laptop. These settings make sure it's safe if it ever gets turned on.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PermitEmptyPasswords no
X11Forwarding no
AllowAgentForwarding no
MaxAuthTries 3
LogLevel VERBOSE
